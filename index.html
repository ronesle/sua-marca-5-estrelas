    <style>
        :root {
            --bg-dark: #070B14;
            --bg-card: rgba(17, 25, 40, 0.82);
            --border-light: rgba(255, 255, 255, 0.1);
            --gold: #F59E0B;
            --gold-light: #FDE68A;
            --orange: #EA580C;
            --emerald: #10B981;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            line-height: 1.65;
            letter-spacing: 0.01em;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-display {
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        section[id] {
            scroll-margin-top: 85px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .text-gold {
            background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 50%, #EA580C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* HEADER & LOGO RESPONSIVA EM SVG */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(7, 11, 20, 0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-light);
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 76px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .site-logo {
            width: 100%;
            max-width: 200px; /* Tamanho fluido e elegante */
            height: auto;     /* Proporção perfeita mantida */
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 26px;
        }

        .nav-links a {
            color: #CBD5E1;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .btn-top {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-top:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .dot-green {
            width: 8px;
            height: 8px;
            background: var(--emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--emerald);
        }

        /* HERO SECTION */
        .hero {
            padding: 140px 0 90px;
            background: 
                radial-gradient(circle at 18% 25%, rgba(245, 158, 11, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                linear-gradient(to bottom, rgba(7, 11, 20, 0.86), rgba(7, 11, 20, 0.98)),
                url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 48px;
            align-items: center;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.14);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: var(--gold-light);
            padding: 7px 15px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: 2.85rem;
            font-weight: 700;
            line-height: 1.18;
            margin-bottom: 18px;
        }

        .hero h2.sub-seo {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            color: #CBD5E1;
            margin-bottom: 30px;
            max-width: 590px;
            font-weight: 400;
            line-height: 1.65;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);
            color: #070B14;
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 15px 28px;
            border-radius: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -6px rgba(234, 88, 12, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -6px rgba(234, 88, 12, 0.7);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-weight: 500;
            font-size: 0.98rem;
            padding: 15px 24px;
            border-radius: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .hero-checks {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 0.88rem;
            color: #CBD5E1;
        }

        .hero-checks span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .check-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.2);
            color: var(--emerald);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
        }

        /* HERO VISUAL CARD */
        .visual-showcase {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
        }

        .visual-photo {
            height: 215px;
            background-image: 
                linear-gradient(to top, #0B1120 5%, rgba(11, 17, 32, 0.15) 60%),
                url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=85');
            background-size: cover;
            background-position: center;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .tag-dark {
            background: rgba(7, 11, 20, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tag-star {
            background: var(--gold);
            color: #070B14;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .visual-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .review-box {
            background: rgba(7, 11, 20, 0.75);
            border-radius: 16px;
            padding: 16px;
            border-left: 4px solid var(--emerald);
        }

        .review-box.quarantine {
            border-left-color: var(--orange);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .status-pill {
            font-size: 0.68rem;
            padding: 3px 9px;
            border-radius: 99px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.2);
            color: #34D399;
        }

        .status-lock {
            background: rgba(234, 88, 12, 0.25);
            color: #FDBA74;
        }

        .review-quote {
            font-size: 0.84rem;
            color: #CBD5E1;
            font-style: italic;
            margin-bottom: 8px;
        }

        .review-reply {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #E2E8F0;
        }

        /* SECTIONS GENERAL */
        section {
            padding: 90px 0;
        }

        .section-header {
            text-align: center;
            max-width: 740px;
            margin: 0 auto 56px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 0.76rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 10px;
        }

        .section-header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1.22;
            margin-bottom: 14px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.02rem;
        }

        /* GRID 3 CARDS (STATS) */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .card-glass {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 32px;
            transition: transform 0.25s, border-color 0.25s;
        }

        .card-glass:hover {
            transform: translateY(-4px);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .stat-number {
            font-family: 'Sora', sans-serif;
            font-size: 3.4rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 14px;
        }

        .card-glass h3 {
            font-size: 1.18rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-glass p {
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        /* 4 STEPS FLOW */
        .section-alt {
            background: radial-gradient(circle at center, rgba(245, 158, 11, 0.08) 0%, rgba(15, 23, 42, 0.6) 100%);
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .step-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .step-num {
            font-family: 'Sora', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.14);
        }

        .step-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .step-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gold-light);
        }

        /* COMPARISON CARDS */
        .comp-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .comp-card.featured {
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.16) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 2px solid var(--gold);
            box-shadow: 0 20px 45px -15px rgba(245, 158, 11, 0.25);
            position: relative;
        }

        .featured-ribbon {
            position: absolute;
            top: -13px;
            right: 24px;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            color: #070B14;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 99px;
            letter-spacing: 0.8px;
        }

        .comp-list {
            list-style: none;
            margin: 22px 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comp-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9rem;
            color: #E2E8F0;
        }

        .icon-no {
            color: #F87171;
            font-weight: 700;
            flex-shrink: 0;
        }

        .icon-yes {
            color: var(--emerald);
            font-weight: 700;
            flex-shrink: 0;
        }

        /* PRICING */
        .setup-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-left: 5px solid var(--gold);
            border-radius: 24px;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 32px;
        }

        .setup-price-box {
            background: rgba(7, 11, 20, 0.85);
            border: 1px solid var(--border-light);
            padding: 18px 28px;
            border-radius: 18px;
            text-align: right;
            flex-shrink: 0;
        }

        .setup-price-box .big {
            font-family: 'Sora', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .price-tag {
            font-family: 'Sora', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            margin: 18px 0;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-light);
        }

        .price-tag small {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .addon-box {
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        /* FAQ ACORDEÃO LIMPO PARA SEO */
        .faq-wrap {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        details.faq-item {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 18px 24px;
            transition: border-color 0.2s;
        }

        details.faq-item[open] {
            border-color: rgba(245, 158, 11, 0.45);
        }

        details.faq-item summary {
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        details.faq-item summary::-webkit-details-marker {
            display: none;
        }

        details.faq-item summary::after {
            content: "+";
            font-size: 1.4rem;
            color: var(--gold);
            font-weight: 400;
        }

        details.faq-item[open] summary::after {
            content: "−";
        }

        details.faq-item p {
            margin-top: 12px;
            font-size: 0.92rem;
            color: var(--text-muted);
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* FORM SECTION */
        .form-card {
            max-width: 760px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 2px solid rgba(16, 185, 129, 0.45);
            border-radius: 28px;
            padding: 44px;
            box-shadow: 0 25px 60px -15px rgba(16, 185, 129, 0.18);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #CBD5E1;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: #070B14;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .btn-whatsapp {
            width: 100%;
            background: var(--emerald);
            color: #052E16;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 18px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 12px 30px -6px rgba(16, 185, 129, 0.45);
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-whatsapp:hover {
            background: #34D399;
            transform: translateY(-2px);
        }

        /* FLOATING WHATSAPP */
        .float-wa {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--emerald);
            color: #052E16;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
            transition: transform 0.2s;
        }

        .float-wa:hover {
            transform: scale(1.08);
        }

        footer {
            padding: 40px 0;
            border-top: 1px solid var(--border-light);
            text-align: center;
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 960px) {
            .hero-grid, .grid-3, .grid-4, .grid-2, .form-grid {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
            .hero {
                padding: 115px 0 60px;
                text-align: center;
            }
            .hero h1 {
                font-size: 2.05rem;
            }
            .hero h2.sub-seo {
                margin: 0 auto 28px;
                font-size: 0.98rem;
            }
            .hero-actions, .hero-checks {
                justify-content: center;
            }
            .setup-banner, .addon-box {
                flex-direction: column;
                text-align: left;
                align-items: flex-start;
            }
            .setup-price-box {
                width: 100%;
                text-align: left;
            }
            .section-header h2 {
