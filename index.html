<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Marca 5 Estrelas | Blindagem e Reputação para Gastronomia</title>
    <meta name="description" content="Gestão ativa e blindagem de reputação no Google para bares e restaurantes.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Outfit (Títulos Arrojados) & Plus Jakarta Sans (Leitura) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #060913;
            color: #F8FAFC;
            overflow-x: hidden;
        }
        /* Efeitos de Luz e Degradê */
        .glow-amber {
            background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(6, 9, 19, 0) 70%);
        }
        .glow-emerald {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(6, 9, 19, 0) 70%);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-hover {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-6px);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.15);
        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 50%, #EA580C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient-gold {
            background: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
            box-shadow: 0 10px 30px -5px rgba(234, 88, 12, 0.45);
        }
        .btn-gradient-gold:hover {
            box-shadow: 0 15px 35px -5px rgba(234, 88, 12, 0.65);
            transform: translateY(-2px);
        }
        .hero-bg-image {
            background-image: linear-gradient(to bottom, rgba(6, 9, 19, 0.80), rgba(6, 9, 19, 0.96)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
